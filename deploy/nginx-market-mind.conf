# Public antifire.quest: CLOSED. The site is tailnet-only (server below);
# every public request gets 444 (connection dropped, no response). The block
# stays so this name never falls through to another vhost on the box, and the
# 444 sits in `location /` rather than at server level so certbot's renewal
# challenge location still matches on port 80.
server {
    server_name antifire.quest;

    location / {
        return 444;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/antifire.quest/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/antifire.quest/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    listen 80;
    server_name antifire.quest;

    location / {
        return 444;
    }
}

# Private site: tailnet-only. tailscaled terminates HTTPS for
# https://marketmind.manee-kingsnake.ts.net and proxies here
# (`tailscale serve --bg --https=443 http://127.0.0.1:8080`). Loopback bind:
# this server is unreachable from the internet by construction.
server {
    listen 127.0.0.1:8080;
    server_name _;

    # Signal bot relay (forge cards)
    location /signal/ {
        limit_req zone=signal_bot burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:8420/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    35s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # React frontend
    location / {
        root /var/www/market-mind/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
